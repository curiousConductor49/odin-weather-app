<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenki: An Odin Project Weather App</title>
  </head>
  <body>
    <main>
      <h1>Tenki - Access the Atmos</h1>
      <div id="search-bar-container">
        <form id="search-form">
          <label for="weather-search">Enter a location</label>
          <input type="text" name="weather-search" id="weather-search">
          <button type="submit" id="submit-btn">Search</button>
        </form>
      </div>
      <div id="weather-display">
        <img id="weather-icon" src="#">
        <div id="conditions"></div>
        <div id="temperature-data">
          <div>
            <input type="checkbox" name="temp-unit-toggle" id="temp-unit-toggle">
            <label for="temp-unit-toggle">Celsius</label>
          </div>
          <span id="temp"></span>
          <span id="feels-like"></span>
        </div>
        <div id="humidity"></div>
        <div id="windspeed"></div>
        <div id="windgust"></div>
      </div>
      <dialog id="error-message-modal">
        <p>Whoops! Looks like that data isn't available.</p>
        <button type="button" id="close-dialog-btn">Return to search</button>
      </dialog>
    </main>
  </body>
</html>
